<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Sweepstake</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;--surface:rgba(255,255,255,0.06);--surface-hi:rgba(255,255,255,0.11);
  --border:rgba(255,255,255,0.12);--border-hi:rgba(0,229,160,0.35);
  --neon:#00e5a0;--neon-glow:rgba(0,229,160,0.25);--neon-dim:rgba(0,229,160,0.12);
  --blue:#3b82f6;--purple:#8b5cf6;
  --text:#e8f0fe;--muted:rgba(232,240,254,0.5);--subtle:rgba(232,240,254,0.25);
  --gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;
  --r:16px;--r-sm:8px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}

/* ── Blobs ── */
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:0.15;pointer-events:none;z-index:0;will-change:transform;transform:translateZ(0)}
.blob-1{width:700px;height:500px;background:var(--neon);top:-15%;left:-15%;
  animation:b1 16s ease-in-out infinite alternate}
.blob-2{width:600px;height:700px;background:#1d4ed8;top:35%;right:-20%;
  animation:b2 20s ease-in-out infinite alternate}
.blob-3{width:500px;height:500px;background:#7c3aed;bottom:-10%;left:25%;
  animation:b3 13s ease-in-out infinite alternate}
@keyframes b1{to{transform:translate(120px,80px) scale(1.15)}}
@keyframes b2{to{transform:translate(-90px,-110px) scale(0.88)}}
@keyframes b3{to{transform:translate(70px,-70px) scale(1.12)}}

/* ── Progress bar ── */
#prog{position:fixed;top:0;left:0;height:3px;
  background:linear-gradient(to right,var(--neon),var(--blue));z-index:9999;transition:width .5s ease;top:env(safe-area-inset-top,0px)}

/* ── Layout ── */
.app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 24px 60px}

/* ── Glassmorphism ── */
.glass{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:var(--r)}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(12,12,28,0.94)}}

/* ── Hero ── */
.hero{padding:80px 0 60px;text-align:center}
.hero-logo{width:72px;height:72px;margin:0 auto 24px;border-radius:50%;overflow:hidden;
  box-shadow:0 0 40px var(--neon-glow)}
.hero-logo img{width:100%;height:100%;object-fit:cover}
.hero-kicker{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--neon);margin-bottom:20px}
.hero-title{font-size:clamp(52px,8vw,100px);font-weight:900;line-height:0.9;letter-spacing:-3px;
  background:linear-gradient(135deg,#fff 0%,var(--neon) 60%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:20px}
.hero-sub{font-size:14px;color:var(--muted);letter-spacing:1px}

/* ── Section ── */
.section{margin:60px 0}
.sec-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--neon);margin-bottom:12px}
.sec-title{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-1.5px;margin-bottom:32px}

/* ── Countdown ── */
.cd-wrap{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:40px 0}
.cd-cell{min-width:96px;padding:24px 16px;text-align:center}
.cd-cell .num{font-size:clamp(40px,6vw,64px);font-weight:900;color:var(--neon);
  font-variant-numeric:tabular-nums;letter-spacing:-2px;line-height:1;
  text-shadow:0 0 30px var(--neon-glow)}
.cd-cell .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:8px}
.cd-live{text-align:center;padding:32px;font-size:20px;font-weight:700;color:var(--neon)}
.cd-pulse::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;
  background:var(--neon);margin-right:10px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(0.7)}}

/* ── Fixture scroller ── */
.fix-scroll-wrap{position:relative}
.fix-arrow{position:absolute;top:50%;transform:translateY(-50%);
  background:var(--surface-hi);border:1px solid var(--border);color:var(--text);
  width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;z-index:2;
  transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(10px)}
.fix-arrow:hover{border-color:var(--neon);box-shadow:0 0 12px var(--neon-glow)}
.fix-arrow-l{left:-22px}.fix-arrow-r{right:-22px}
.fix-track{display:flex;gap:12px;overflow-x:scroll;scroll-behavior:smooth;
  padding:8px 4px 16px;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x mandatory}
.fix-track::-webkit-scrollbar{display:none}
.fix-card{flex-shrink:0;width:220px;padding:16px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);scroll-snap-align:start}
.fix-group{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--neon);margin-bottom:8px}
.fix-teams{font-size:14px;font-weight:600;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fix-teams .own{font-weight:700}
.fix-time{font-size:12px;color:var(--muted);margin-top:6px}
.fix-empty{padding:24px;color:var(--muted);font-size:14px;font-style:italic}

/* ── Fixture Schedule ── */
.sched-group{margin-bottom:8px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
.sched-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;cursor:pointer;user-select:none;gap:12px;
  background:rgba(255,255,255,0.03);transition:background .2s}
.sched-hdr:hover{background:rgba(255,255,255,0.06)}
.sched-hdr-left{display:flex;align-items:center;gap:10px}
.sched-date-label{font-size:13px;font-weight:700}
.sched-badge{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;font-weight:700}
.sched-badge.today{background:rgba(0,255,136,.15);color:var(--neon);border:1px solid rgba(0,255,136,.3)}
.sched-badge.past{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}
.sched-badge.upcoming{background:rgba(99,179,237,.12);color:#63b3ed;border:1px solid rgba(99,179,237,.25)}
.sched-count{font-size:12px;color:var(--muted)}
.sched-chevron{font-size:14px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.sched-body{display:grid;gap:8px;padding:10px 12px 14px;
  background:rgba(0,0,0,.15)}
.sched-body.collapsed{display:none}
.sched-row{display:grid;grid-template-columns:auto 1fr 1fr auto;
  align-items:center;gap:10px;
  padding:10px 14px;border-radius:6px;
  background:rgba(255,255,255,.03);border:1px solid var(--border)}
.sched-row.has-result{border-color:rgba(0,255,136,.2)}
.sched-grp{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--neon);
  font-weight:700;flex-shrink:0}
.sched-team{display:flex;flex-direction:column;gap:2px}
.sched-team-name{font-size:13px;font-weight:700}
.sched-team-owner{font-size:11px;color:var(--muted)}
.sched-vs{font-size:11px;color:var(--muted);text-align:center;flex-shrink:0}
.sched-result{font-size:16px;font-weight:900;color:var(--neon);text-align:center;
  min-width:36px;flex-shrink:0}
.sched-result.win{color:var(--gold)}
.sched-team-name.win{color:var(--gold)}
.sched-meta{font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;white-space:nowrap}
@media(max-width:600px){
  .sched-row{grid-template-columns:auto 1fr 1fr auto;gap:6px;padding:8px 10px}
  .sched-team-name{font-size:12px}
}



/* ── Insights ── */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ins-card{padding:24px}
.ins-icon{font-size:28px;margin-bottom:12px}
.ins-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--neon);margin-bottom:6px}
.ins-text{font-size:14px;color:var(--text);line-height:1.6}
.ins-empty{padding:32px;color:var(--muted);font-size:14px;font-style:italic}

/* ── League Table ── */
.league-table{width:100%;border-collapse:collapse;font-size:14px}
.league-table thead th{padding:10px 12px;text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
.league-table tbody tr{border-bottom:1px solid rgba(255,255,255,.05);transition:background .15s}
.league-table tbody tr:hover{background:rgba(255,255,255,.04)!important}
.lt-pos{width:32px;text-align:center;font-size:13px;font-weight:700;color:var(--text-dim);padding:14px 8px}
.lt-name{font-size:15px;font-weight:800;padding:14px 12px;white-space:nowrap}
.lt-teams{padding:10px 12px}
.lt-team{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--neon-dim);color:var(--neon);margin:2px 2px 2px 0;white-space:nowrap}
.lt-team-out{opacity:.72;color:rgba(232,240,254,.68);background:rgba(255,120,120,.10);box-shadow:inset 0 0 0 1px rgba(255,120,120,.28);text-decoration:line-through;text-decoration-thickness:1.8px;text-decoration-skip-ink:none;text-decoration-color:rgba(255,145,145,.95)}
.lt-team-out::after{content:' x';font-size:10px;font-weight:700;color:rgba(255,170,170,.95)}
@media(max-width:600px){.lt-team-out{text-decoration-thickness:2.1px}}
.lt-pts{text-align:right;font-size:22px;font-weight:900;color:var(--neon);text-shadow:0 0 15px var(--neon-glow);padding:14px 16px;white-space:nowrap}
.lt-gf{text-align:right;padding:14px 12px;color:var(--text-dim);font-size:13px}
.lt-sw{text-align:right;padding:14px 12px;color:var(--muted);font-size:13px}
.lt-stage{padding:14px 12px;color:var(--muted);font-size:12px}
.lt-detail{padding:10px 12px;color:var(--muted);font-size:10.5px;line-height:1.4;min-width:320px}
.table-legend{margin:0 0 10px;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.02);font-size:11px;color:var(--muted);line-height:1.5}
.table-legend strong{color:var(--text)}
.mobile-rotate-hint{display:none;margin:0 0 10px;padding:8px 10px;border:1px dashed rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.02);font-size:11px;color:var(--muted);text-align:center}
@media(max-width:900px) and (orientation:portrait){.mobile-rotate-hint{display:block}}
@media(max-width:600px){.lt-stage,.lt-gf,.lt-sw{display:none}}

/* ── Golden Boot ── */
.gb-list{display:flex;flex-direction:column;gap:2px}
.gb-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.gb-pos{width:24px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.gb-player{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb-team{font-size:11px;color:var(--muted);flex-shrink:0}
.gb-owner{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--neon-dim);color:var(--neon);flex-shrink:0}
.gb-goals{font-size:18px;font-weight:900;color:var(--neon);text-shadow:0 0 12px var(--neon-glow);flex-shrink:0;min-width:28px;text-align:right}
.gb-assists{font-size:11px;color:var(--muted);flex-shrink:0}
.gb-row:first-child{border-color:rgba(255,215,0,.2);background:rgba(255,215,0,.05)}
.gb-row:first-child .gb-goals{color:var(--gold);text-shadow:0 0 15px rgba(255,215,0,.4)}
.gb-row:first-child .gb-pos{color:var(--gold)}
.gb-empty{padding:32px;color:var(--muted);font-size:14px;font-style:italic;text-align:center}

/* ── Shuffle button ── */
.shuffle-btn{padding:10px 20px;background:var(--neon-dim);color:var(--neon);
  border:1px solid var(--border-hi);border-radius:40px;cursor:pointer;touch-action:manipulation;
  font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  transition:background .2s,box-shadow .2s;backdrop-filter:blur(10px)}
.shuffle-btn:hover{background:rgba(0,229,160,0.2);box-shadow:0 0 20px var(--neon-glow)}

/* ── Footer ── */
.footer{text-align:center;padding:40px 0 calc(20px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--subtle);letter-spacing:1px}

/* ── Scroll reveal ── */
.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}

/* ── Misc ── */
.chip-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
@media(prefers-reduced-motion:reduce){
  .blob-1,.blob-2,.blob-3{animation:none}
  .reveal{transition:none}
  .cd-pulse::before{animation:none}
  .podium-block{transition:none}
}

/* ── Office Duels ── */
#h2h-match-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
  margin-top:15px;
}
.h2h-card{
  background:#1a1a2e;
  border:1px solid #16213e;
  border-radius:10px;
  padding:16px;
  position:relative;
  transition:transform .2s ease,box-shadow .2s ease;
}
.h2h-card:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,.35)}
.h2h-card.workplace-duel{border:1px solid rgba(255,100,100,.25);background:#221b2a}
.duel-badge{
  position:absolute;top:-9px;right:12px;
  background:#ff4757;color:#fff;font-size:9px;font-weight:700;
  padding:2px 8px;border-radius:8px;letter-spacing:.05em;
}
.h2h-meta{
  display:flex;justify-content:space-between;
  font-size:11px;color:rgba(232,240,254,0.75);
  border-bottom:1px solid #16213e;
  padding-bottom:6px;margin-bottom:12px;
}
.h2h-card.workplace-duel .h2h-meta{border-color:#38253a}
.h2h-teams-block{display:flex;align-items:center;gap:8px}
.h2h-competitor{flex:1}
.coworker-identity{font-size:14px;font-weight:700;color:var(--text)}
.nation-identity{font-size:12px;color:rgba(232,240,254,0.75);margin-top:2px}
.h2h-divider{
  text-align:center;color:#4ecca3;font-weight:700;
  font-size:11px;flex-shrink:0;padding:0 4px;
}
.status-indicator{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
.status-indicator.upcoming{background:#16213e;color:#4ecca3}
.status-indicator.today{background:rgba(0,229,160,.15);color:var(--neon)}
.status-indicator.finished{background:#2d3748;color:var(--muted)}
.h2h-empty{padding:24px;color:var(--muted);font-size:14px;font-style:italic}
</style>
</head>

function calculateDrawSweepstakeScores(assignments,resultsData){
  function teamPts(name){
    const d=resultsData&&resultsData[name];
    const stage=(d&&d.stage)||'Group stage exit';
    return POINTS_MAP[stage]??0;
  }
  const leaderboard=assignments.map(u=>{
    const teamBreakdown=u.assignedTeams.map(name=>{
      const d=resultsData&&resultsData[name];
      const stage=(d&&d.stage)||'Group stage exit';
      return{teamName:name,currentStage:stage,totalTeamPoints:POINTS_MAP[stage]??0};
    });
    const totalPoints=teamBreakdown.reduce((s,t)=>s+t.totalTeamPoints,0);
    return{userId:u.userId,totalPoints,teamBreakdown};
  });
  return leaderboard.sort((a,b)=>b.totalPoints-a.totalPoints);
}

const TEAM_OWNER = {};

const TEAM_ALIASES = {
  'Cape Verde Islands': 'Cape Verde',
};
function canonTeamName(team){
  return TEAM_ALIASES[team] || team;
}
Object.entries(TEAM_ALIASES).forEach(([alias, canonical])=>{
  if(TEAM_OWNER[canonical])TEAM_OWNER[alias]=TEAM_OWNER[canonical];
});
const DEFAULT_R = {stage:'Group stage exit',gf:0,ga:0};
function getResult(t){return RESULTS_DATA[t]||DEFAULT_R}
function getPoints(t){return POINTS_MAP[getResult(t).stage]??0}
function getPot(t){return TEAM_POTS[t]||4}

function getScorerGoalsByOwner(owner){
  return SCORERS_DATA
    .filter(s=>s.owner===owner)
    .reduce((m,s)=>Math.max(m,s.goals||0),0);
}

function getKoPlayedFixtures(){
  return FIXTURES.filter(f=>f.group==='KO'&&f.hg!==undefined&&f.ag!==undefined&&f.hg!==f.ag);
}

function buildKoTeamStatus(){
  const status={};
  PARTICIPANTS.forEach(p=>p.teams.forEach(t=>{status[t]={wins:0,losses:0,hasKoFixture:false};}));

  FIXTURES.forEach(f=>{
    if(f.group!=='KO')return;
    const home=canonTeamName(f.home);
    const away=canonTeamName(f.away);
    if(status[home])status[home].hasKoFixture=true;
    if(status[away])status[away].hasKoFixture=true;
    if(f.hg===undefined||f.ag===undefined||f.hg===f.ag)return;
    const homeWin=f.hg>f.ag;
    const winner=homeWin?home:away;
    const loser=homeWin?away:home;
    if(status[winner])status[winner].wins+=1;
    if(status[loser])status[loser].losses+=1;
  });

  const koStarted=getKoPlayedFixtures().length>0;

  function stageFromStatus(team){
    if(!koStarted)return getResult(team).stage;
    const rec=status[team]||{wins:0,losses:0,hasKoFixture:false};
    if(rec.losses>0){
      const byWins=['Round of 32','Round of 16','Quarterfinals','Semifinals','Final (runner-up)'];
      return byWins[Math.min(rec.wins,byWins.length-1)];
    }
    if(rec.wins>0){
      const activeByWins=['Group stage exit','Round of 16','Quarterfinals','Semifinals','Final (runner-up)','Champion'];
      return activeByWins[Math.min(rec.wins,activeByWins.length-1)];
    }
    return rec.hasKoFixture?'Round of 32':'Group stage exit';
  }

  function isActive(team){
    if(!koStarted){
      return getResult(team).stage!=='Group stage exit';
    }
    const rec=status[team]||{wins:0,losses:0,hasKoFixture:false};
    if(rec.losses>0)return false;
    if(rec.wins>0)return true;
    if(rec.hasKoFixture)return true;
    return false;
  }

  return{status,koStarted,stageFromStatus,isActive};
}

function buildLeaderboard(){
  const ko=buildKoTeamStatus();
  const knockoutsStarted=ko.koStarted||Object.values(RESULTS_DATA).some(r=>r.stage!=='Group stage exit');

  const rows=PARTICIPANTS.map(p=>{
    const stagePoints=p.teams.reduce((s,t)=>s+(POINTS_MAP[ko.stageFromStatus(t)]??0),0);
    const active=p.teams.filter(t=>ko.isActive(t)).length;
    const gf=p.teams.reduce((s,t)=>s+(RESULTS_DATA[t]?.gf||0),0);
    return{
      name:p.name,
      teams:p.teams,
      stagePoints,
      active,
      gf,
    };
  });

  // Do not rank on group-stage activity. Rankings begin at knockout stage only.
  if(!knockoutsStarted){
    return rows.sort((a,b)=>a.name.localeCompare(b.name)).map((p,i)=>({
      ...p,
      placementBonus:0,
      tournamentScore:p.stagePoints,
      score:p.tournamentScore,
      rank:i+1,
    }));
  }

  const tournamentOrder=[...rows].sort((a,b)=>{
    if(b.stagePoints!==a.stagePoints)return b.stagePoints-a.stagePoints;
    if(b.active!==a.active)return b.active-a.active;
    return a.name.localeCompare(b.name);
  });

  let currentRank=0;
  tournamentOrder.forEach((r,i)=>{
    if(
      i===0||
      r.stagePoints!==tournamentOrder[i-1].stagePoints||
      r.active!==tournamentOrder[i-1].active
    ){
      currentRank=i+1;
    }
    r.tournamentRank=currentRank;
    r.placementBonus=0;
    r.tournamentScore=r.stagePoints;
    r.score=r.stagePoints;
  });

  rows.sort((a,b)=>{
    if(b.score!==a.score)return b.score-a.score;
    if(b.tournamentScore!==a.tournamentScore)return b.tournamentScore-a.tournamentScore;
    return a.name.localeCompare(b.name);
  });
  const result=[];
  for(let i=0;i<rows.length;i++){
    if(i===0){result.push({...rows[i],rank:1});continue}
    const prev=result[i-1];
    const sameRank=prev.score===rows[i].score;
    result.push({...rows[i],rank:sameRank?prev.rank:i+1});
  }
  return result;
}

function calculateInsights(lb){
  const started=Object.values(RESULTS_DATA).some(r=>r.gf>0||r.ga>0);
  if(!started)return null;
  const knockoutsStarted=Object.values(RESULTS_DATA).some(r=>r.stage!=='Group stage exit');
  const hi=lb[0],lo=lb[lb.length-1];
  const totalGoals=Object.values(RESULTS_DATA).reduce((s,r)=>s+r.gf,0);
  const matchesPlayed=Math.round(totalGoals/2.5)||1;
  let depPart=null;
  for(const e of lb){
    const pts=e.teams.map(t=>getPoints(t));
    const tot=pts.reduce((a,v)=>a+v,0);
    if(tot>0){
      const maxPts=Math.max(...pts);
      const share=maxPts/tot;
      if(share>=0.6&&(!depPart||share>depPart.share))
        depPart={...e,share,topTeam:e.teams[pts.indexOf(maxPts)],topPts:maxPts};
    }
  }
  let balanced=null;
  for(const e of lb){
    const pts=e.teams.map(t=>getPoints(t));
    if(!pts.some(p=>p>0))continue;
    const mean=pts.reduce((a,v)=>a+v,0)/pts.length;
    const sd=Math.sqrt(pts.reduce((a,v)=>a+(v-mean)**2,0)/pts.length);
    if(!balanced||sd<balanced.sd)balanced={...e,sd};
  }
  let bestTeam=null,bestPts=-1;
  for(const e of lb)for(const t of e.teams){const p=getPoints(t);if(p>bestPts){bestPts=p;bestTeam=t;}}
  const activeCount=Object.values(RESULTS_DATA).filter(r=>r.stage!=='Group stage exit').length;
  // Group stage: show goals-based insights since all pts=0
  if(!knockoutsStarted){
    let topGFteam=null,topGF=0;
    for(const [t,r] of Object.entries(RESULTS_DATA)){if(r.gf>topGF){topGF=r.gf;topGFteam=t;}}
    let topOwnerGF=null,topOwnerGFval=0;
    for(const e of lb){const gf=e.teams.reduce((s,t)=>s+(RESULTS_DATA[t]?.gf||0),0);if(gf>topOwnerGFval){topOwnerGFval=gf;topOwnerGF=e.name;}}
    const items=[
      {icon:'\u26BD',label:'Group stage',text:`${totalGoals} goals scored so far`},
      {icon:'\u{1F3C6}',label:'Top scoring owner',text:`${topOwnerGF||'—'} leads on goals (${topOwnerGFval})`},
    ];
    if(topGFteam&&topGF>0)items.push({icon:'\u{1F31F}',label:'Top scoring team',text:`${topGFteam} leads with ${topGF} goals`});
    items.push({icon:'\u{1F4CA}',label:'Points',text:'Points awarded from Round of 32 onwards'});
    return items;
  }
  const items=[
    {icon:'\u{1F3C6}',label:'Leading scorer',text:`${hi.name} leads with ${hi.score} pts`},
    {icon:'\u{1F4C9}',label:'Last place',text:`${lo.name} is bottom with ${lo.score} pts`},
  ];
  if(depPart)items.push({icon:'\u26BD',label:'One-team reliance',text:`${depPart.name} is ${Math.round(depPart.share*100)}% reliant on ${depPart.topTeam}`});
  if(balanced)items.push({icon:'\u2696\uFE0F',label:'Most balanced',text:`${balanced.name} has the most balanced squad`});
  if(bestTeam&&bestPts>0)items.push({icon:'\u{1F31F}',label:'Standout performer',text:`${TEAM_OWNER[bestTeam]}\u2019s ${bestTeam} leads all teams`});
  items.push({icon:'\u{1F3AF}',label:'Teams still active',text:`${activeCount} teams still in the tournament`});
  return items;
}

function renderFixtures(today){
  const QUARTERFINALS_START='2026-07-07';
  const quarterfinalsOnward=FIXTURES.filter(f=>f.d>=QUARTERFINALS_START);
  const tomorrow=new Date(today+'T00:00:00');
  tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr=`${tomorrow.getFullYear()}-${p2(tomorrow.getMonth()+1)}-${p2(tomorrow.getDate())}`;

  let todayFix=quarterfinalsOnward.filter(f=>f.d===today);
  let tomorrowFix=quarterfinalsOnward.filter(f=>f.d===tomorrowStr);

  // If no matches today, find next day with matches and show that + the day after
  if(!todayFix.length){
    const upcoming=quarterfinalsOnward.filter(f=>f.d>=today).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
    if(!upcoming.length)return`<div class="fix-empty">No Quarterfinal (or later) fixtures loaded yet.</div>`;
    const nextDay=upcoming[0].d;
    todayFix=quarterfinalsOnward.filter(f=>f.d===nextDay);
    const afterNext=upcoming.find(f=>f.d>nextDay);
    tomorrowFix=afterNext?quarterfinalsOnward.filter(f=>f.d===afterNext.d):[];
  }

  function makeCards(fixes,label){
    if(!fixes.length)return'';
    const cards=fixes.map(f=>{
      const ho=TEAM_OWNER[f.home],ao=TEAM_OWNER[f.away];
      const hStyle=ho?` style="color:var(--neon)"`:''
      const aStyle=ao?` style="color:var(--neon)"`:''
      return`<div class="fix-card">
        <div class="fix-group">Group ${f.group}</div>
        <div class="fix-teams"><span class="own"${hStyle}>${f.home}</span> <span style="color:var(--muted)">vs</span> <span class="own"${aStyle}>${f.away}</span></div>
        <div class="fix-time">${f.t} HKT &middot; ${f.d}</div>
      </div>`;
    }).join('');
    return`<p style="font-size:13px;color:var(--muted);margin:12px 0 8px">${label} &mdash; ${fixes.length} match${fixes.length>1?'es':''}</p>${cards}`;
  }

  const todayLabel=todayFix.length&&todayFix[0].d===today?'Today':'Next: '+todayFix[0]?.d;
  const tomorrowLabel=tomorrowFix.length?(todayFix[0]?.d===today?'Tomorrow':'Then: '+tomorrowFix[0].d):'';
  const allCards=makeCards(todayFix,todayLabel)+(tomorrowFix.length?makeCards(tomorrowFix,tomorrowLabel):'');

  return`<div class="fix-scroll-wrap">
    <button class="fix-arrow fix-arrow-l" onclick="document.getElementById('ftk').scrollBy({left:-260,behavior:'smooth'})" aria-label="Scroll left">&#8249;</button>
    <div class="fix-track" id="ftk">${allCards}</div>
    <button class="fix-arrow fix-arrow-r" onclick="document.getElementById('ftk').scrollBy({left:260,behavior:'smooth'})" aria-label="Scroll right">&#8250;</button>
  </div>`;
}

function renderFixtureSchedule(){
  const QUARTERFINALS_START='2026-07-07';
  const quarterfinalsOnward=FIXTURES.filter(f=>f.d>=QUARTERFINALS_START);
  const today=todayStr();
  const cutFuture=new Date(today+'T00:00:00');
  cutFuture.setDate(cutFuture.getDate()+3);
  const cutFutureStr=cutFuture.toISOString().slice(0,10);

  // Group fixtures by date
  const byDate={};
  quarterfinalsOnward.forEach(f=>{
    if(!byDate[f.d])byDate[f.d]=[];
    byDate[f.d].push(f);
  });
  const dates=Object.keys(byDate).sort();
  if(!dates.length)return'<div class="fix-empty">No Quarterfinal (or later) fixtures loaded yet.</div>';

  function dayLabel(d){
    if(d===today)return'Today';
    const diff=(new Date(d+'T00:00:00')-new Date(today+'T00:00:00'))/(86400000);
    if(diff===1)return'Tomorrow';
    if(diff===-1)return'Yesterday';
    const dt=new Date(d+'T00:00:00');
    return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  }

  function badgeClass(d){
    if(d===today)return'today';
    return d<today?'past':'upcoming';
  }

  return dates.map(d=>{
    const fixes=byDate[d];
    const isPast=d<today;
    const isWindow=d>=today&&d<=cutFutureStr;
    const isOpen=isWindow||d===today;
    const badge=d===today?'Today':isPast?'Played':'Upcoming';
    const label=dayLabel(d);

    const rows=fixes.map(f=>{
      const hasScore=f.hg!==undefined&&f.ag!==undefined;
      const ho=TEAM_OWNER[f.home]||'';
      const ao=TEAM_OWNER[f.away]||'';
      const homeWon=hasScore&&f.hg>f.ag;
      const awayWon=hasScore&&f.ag>f.hg;
      const scoreHtml=hasScore
        ?`<div class="sched-result">${f.hg}&ndash;${f.ag}</div>`
        :`<div class="sched-meta">${f.t}<br>HKT</div>`;
      return`<div class="sched-row${hasScore?' has-result':''}">
        <div class="sched-grp">Grp ${f.group}</div>
        <div class="sched-team">
          <div class="sched-team-name${homeWon?' win':''}">${f.home}</div>
          <div class="sched-team-owner">${ho}</div>
        </div>
        <div class="sched-team" style="text-align:right">
          <div class="sched-team-name${awayWon?' win':''}">${f.away}</div>
          <div class="sched-team-owner" style="text-align:right">${ao}</div>
        </div>
        ${scoreHtml}
      </div>`;
    }).join('');

    return`<div class="sched-group">
      <div class="sched-hdr" onclick="this.nextElementSibling.classList.toggle('collapsed');this.querySelector('.sched-chevron').style.transform=this.nextElementSibling.classList.contains('collapsed')?'':'rotate(90deg)'">
        <div class="sched-hdr-left">
          <span class="sched-date-label">${label}</span>
          <span class="sched-badge ${badgeClass(d)}">${badge}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="sched-count">${fixes.length} match${fixes.length>1?'es':''}</span>
          <span class="sched-chevron" style="transform:${isOpen?'rotate(90deg)':''}">&#9654;</span>
        </div>
      </div>
      <div class="sched-body${isOpen?'':' collapsed'}">${rows}</div>
    </div>`;
  }).join('');
}

function isGroupStageFixture(f){
  const g=(f&&f.group)||'';
  return /^GROUP_/i.test(g)||/^Group\s+[A-L]$/i.test(g)||/^[A-L]$/i.test(g);
}

function getTeamGroupStagePts(team){
  let pts=0;
  FIXTURES.forEach(f=>{
    if(!isGroupStageFixture(f))return;
    if(f.hg===undefined||f.ag===undefined)return;
    if(f.home===team){pts+=f.hg>f.ag?3:f.hg===f.ag?1:0;}
    else if(f.away===team){pts+=f.ag>f.hg?3:f.hg===f.ag?1:0;}
  });
  return pts;
}

function getTeamGroupStageGoals(team){
  let gf=0;
  FIXTURES.forEach(f=>{
    if(!isGroupStageFixture(f))return;
    if(f.hg===undefined||f.ag===undefined)return;
    if(f.home===team)gf+=f.hg;
    else if(f.away===team)gf+=f.ag;
  });
  return gf;
}

function getTeamGroupStageConceded(team){
  let ga=0;
  FIXTURES.forEach(f=>{
    if(!isGroupStageFixture(f))return;
    if(f.hg===undefined||f.ag===undefined)return;
    if(f.home===team)ga+=f.ag;
    else if(f.away===team)ga+=f.hg;
  });
  return ga;
}

function getTeamGroupStageMatchDetails(team){
  const out=[];
  FIXTURES.forEach(f=>{
    if(!isGroupStageFixture(f))return;
    if(f.hg===undefined||f.ag===undefined)return;
    if(f.home===team)out.push(`vs ${f.away} (${f.hg}-${f.ag})`);
    else if(f.away===team)out.push(`vs ${f.home} (${f.ag}-${f.hg})`);
  });
  return out;
}

function renderGroupStageFinalScoreboard(){
  const rows=PARTICIPANTS.map(p=>{
    const teamStats=p.teams.map(team=>({
      team,
      pts:getTeamGroupStagePts(team),
      gf:getTeamGroupStageGoals(team),
      ga:getTeamGroupStageConceded(team),
      details:getTeamGroupStageMatchDetails(team),
    }));
    return{
      name:p.name,
      teamStats,
      fifaPoints:teamStats.reduce((s,t)=>s+t.pts,0),
      totalGoals:teamStats.reduce((s,t)=>s+t.gf,0),
      conceded:teamStats.reduce((s,t)=>s+t.ga,0),
      topCountryGoals:Math.max(...teamStats.map(t=>t.gf)),
      leastCountryConceded:Math.min(...teamStats.map(t=>t.ga)),

  });

  rows.sort((a,b)=>{
    if(b.fifaPoints!==a.fifaPoints)return b.fifaPoints-a.fifaPoints;
    if(b.totalGoals!==a.totalGoals)return b.totalGoals-a.totalGoals;
    if(a.conceded!==b.conceded)return a.conceded-b.conceded;
    return a.name.localeCompare(b.name);
  });

  const fifaWinner=rows[0]?rows[0].name:null;
  const maxTopCountryGoals=Math.max(...rows.map(r=>r.topCountryGoals));

  const rendered=rows.map((entry,idx)=>{

      <td class="lt-detail">${detailText}</td>
    </tr>`;
  }).join('');

  return`<div class="table-legend"><strong>Group Stage Method:</strong> Highest FIFA Points +600 (single winner via points then goals scored), Highest goal-scoring country +300, Least goals conceded country +300, Least total FIFA Points +300.</div>

  const tournStart=new Date('2026-06-12T08:00:00').getTime();
  const tournEnd=new Date('2026-07-19T21:00:00').getTime();
  const now=Date.now();
  if(now<tournStart){prog.style.width='0%';return;}
  if(now>tournEnd){prog.style.width='100%';return;}
  const pct=Math.min(100,((now-tournStart)/(tournEnd-tournStart))*100);
  prog.style.width=pct.toFixed(2)+'%';
}

/* score counter via rAF — counts up from 0 to data-target */
function animateCounter(el){
  const target=parseInt(el.dataset.target,10)||0;
  if(isNaN(target)||target===0){el.textContent='0';return;}
  const duration=900,start=performance.now();
  function tick(now){
    const t=Math.min(1,(now-start)/duration);
    const eased=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    el.textContent=Math.round(eased*target);
    if(t<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function initCounters(){
  if('IntersectionObserver' in window){
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          const el=e.target;
          if(!el.dataset.counted){el.dataset.counted='1';animateCounter(el);}
        }
      });
    },{rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('[data-target]').forEach(el=>obs.observe(el));
  } else {
    document.querySelectorAll('[data-target]').forEach(el=>{el.textContent=el.dataset.target||'0';});
  }
}

function initReveal(){
  if('IntersectionObserver' in window){
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
    },{rootMargin:'0px 0px -60px 0px'});
    document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
  } else {
    document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));
  }
}

const _pick=arr=>arr[Math.floor(Math.random()*arr.length)];

function generateContextualSledge(homeTeam,awayTeam){
  if(!homeTeam||!awayTeam)return'A classic football match. One team will be disappointed.';
  const theatrical=['Spain','Italy','Portugal','Brazil','Argentina','Uruguay'];
  const homeT=theatrical.includes(homeTeam);
  const awayT=theatrical.includes(awayTeam);
  const s=BANTER_RIVALRY_MATRIX.STEREOTYPES;
  if(homeTeam==='Australia'||awayTeam==='Australia'){
    const opp=homeTeam==='Australia'?awayTeam:homeTeam;
    return _pick([
      opp+' better pull their head in. Australia is out here sliding flat out like a lizard drinking and has zero regrets.',
      'Fair dinkum: if '+opp+' thinks they are walking away with points, they have got kangaroos loose in the top paddock.',
      'Australia is treating this like the post-match coldie at the Bottle-O is at stake. '+opp+' has been warned.',
      'Crikey, '+opp+' is in trouble. Australia is true blue and defo not here for a smoko and a sanger.',
      'G\'day '+opp+'. Australia is bloody rapt to be here and will give you a heaps good hiding. No wuckas.',
      opp+' reckon they can handle this? She\'ll be apples said no one watching Australia play. Ever.',
    ]);
  }
  if(homeTeam==='New Zealand'||awayTeam==='New Zealand'){
    const opp=homeTeam==='New Zealand'?awayTeam:homeTeam;
    return opp+' watch out. New Zealand left the rugby field specifically to ruin someone\'s day in this tournament.';
  }
  if(homeT&&awayT)return _pick([...BANTER_RIVALRY_MATRIX.EURO_DRAMA,...BANTER_RIVALRY_MATRIX.LATIN_WARFARE]);
  if(s[homeTeam]&&s[awayTeam])return homeTeam+': '+s[homeTeam]+'. Meanwhile '+awayTeam+': '+s[awayTeam]+'.';
  if(s[homeTeam])return homeTeam+' is busy '+s[homeTeam]+'. '+awayTeam+' just has to survive.';
  if(s[awayTeam])return'Hold firm — '+awayTeam+' is '+s[awayTeam]+'.';
  return homeTeam+' vs '+awayTeam+'. One side walks away disappointed. Classic football.';
}

function woodenSpoonRoast(last,secondLast,total){
  const name=last.name,score=last.score,rank=last.rank,active=last.active,gf=last.gf;
  const gapAbove=secondLast?secondLast.score-score:0;
  const nameAbove=secondLast?secondLast.name:'';
  const gs=gf!==1?'s':'';
  const ps=gapAbove!==1?'s':'';
  const behind=gapAbove>0?gapAbove+' point'+ps+' behind '+nameAbove:'dead level with '+nameAbove+' at the bottom';
  const aliveStr=active===0?'zero teams surviving':active+' team'+(active!==1?'s':'')+' still alive';
  return _pick([
    'BLOWOUT: '+name+' is rank '+rank+'/'+total+' on '+score+' pts \u2014 '+aliveStr+', '+behind+'. Defo cactus.',
    'LADDER ANCHOR: '+name+' is dead last on '+score+' pts. Flat out like a lizard drinking, '+behind+'.',
    'TOP PADDOCK ALERT: '+name+' \u2014 rank '+rank+'/'+total+', '+score+' pts, '+gf+' goal'+gs+' all tournament. Kangaroos loose in the top paddock.',
    'BLUDGER WATCH: '+name+' is the definition of a bludger \u2014 rank '+rank+'/'+total+', '+score+' pts. '+aliveStr+'. Buckley\'s chance.',
    'CACTUS: '+name+' \u2014 '+score+' pts, '+behind+'. Rooted, buggered, dead on arrival.',
    'STREWTH: Strewth, '+name+' is devo. Rank '+rank+'/'+total+', '+score+' pts and not a snag\'s chance at the barnie.',
  ]);
}

function buildLiveBanter(lb){
  const started=Object.values(RESULTS_DATA).some(r=>r.gf>0||r.ga>0);
  const countryToOwner={};
  PARTICIPANTS.forEach(u=>{u.teams.forEach(t=>{countryToOwner[t]=u.name;});});
  const todayIso=new Date().toISOString().slice(0,10);
  const tomorrowIso=new Date(Date.now()+86400000).toISOString().slice(0,10);

  if(!started){
    return[
      ...BANTER_FEED,
      'The tournament is about to begin. Set your expectations accordingly.',
      '12 players. 48 teams. One champion. The maths is brutal for most of you.',
      'Someone in this group picked Paraguay. That person knows who they are.',
    ].slice(0,5);
  }

  const lines=[];

  // 1. Wooden spoon roast — always leads
  const last=lb[lb.length-1];
  const secondLast=lb.length>=2?lb[lb.length-2]:null;
  const lastHasPlayed=last&&last.teams.some(t=>{const d=RESULTS_DATA[t];return d&&(d.gf>0||d.ga>0);});
  if(lastHasPlayed)lines.push(woodenSpoonRoast(last,secondLast,lb.length));

  // 2. Leader taunt if there is a clear gap
  const leader=lb[0];
  if(leader&&leader.score>0&&lb.length>=2&&leader.score>lb[1].score){
    const gap=leader.score-lb[1].score;
    const gapStr=gap!==1?'s':'';
    lines.push(_pick([
      leader.name+' leads by '+gap+' point'+gapStr+' and is bloody stoked about it. '+lb[1].name+' is cracking the shits.',
      'Deadset, '+leader.name+' is '+gap+' point'+gapStr+' clear and rapt. '+lb[1].name+' is not having a ripper arvo.',
      'You beauty \u2014 '+leader.name+' is '+gap+' point'+gapStr+' ahead and living their best life. '+lb[1].name+' reckon they can catch up? Iffy at best.',
    ]));
  }else if(leader&&leader.score===0){
    const _byFifa=lb.map(p=>({name:p.name,pts:p.teams.reduce((s,t)=>s+getTeamFifaPts(t),0),gf:p.gf}))
      .sort((a,b)=>b.pts!==a.pts?b.pts-a.pts:b.gf-a.gf);
    const _top=_byFifa[0];
    if(_top&&_top.pts>0){
      const _gap=_top.pts-(_byFifa[1]?.pts||0);
      const _gapStr=_gap>0?' \u2014 '+_gap+' point'+(_gap!==1?'s':'')+' clear':'';
      lines.push('Group stage early doors: '+_top.name+' leads on '+_top.pts+' FIFA pt'+(_top.pts!==1?'s':'')+_gapStr+'. Everyone else is watching and waiting.');
    }else{
      lines.push('Everyone is still on 0 points. The panic will arrive shortly.');
    }
  }

  // Straya callout — fires when Australia has scored
  const ausData=RESULTS_DATA['Australia'];
  const ausOwner=TEAM_OWNER['Australia']||'Steve';
  if(ausData&&ausData.gf>0){
    const ausPlayed=FIXTURES.filter(f=>(f.home==='Australia'||f.away==='Australia')&&f.hg!==undefined).length;
    if(ausData.ga===0){
      lines.push(_pick([
        'Australia: '+ausData.gf+' goal'+(ausData.gf!==1?'s':'')+', zero conceded across '+ausPlayed+' game'+(ausPlayed!==1?'s':'')+'. '+ausOwner+' is insufferable and fully entitled to be.',
        'Straya unbeaten, '+ausData.gf+'\u20130 after '+ausPlayed+' game'+(ausPlayed!==1?'s':'')+'. '+ausOwner+' has not shut up about it. Fair enough.',
        'Clean sheet AND goals on the board for Australia. '+ausOwner+' is walking taller than everyone else in this sweepstake right now.',
        'The Aussies: '+ausData.gf+' scored, none conceded. '+ausOwner+' does not need any encouragement. It has been given anyway.',
      ]));
    } else {
      lines.push(_pick([
        'Australia '+ausData.gf+'\u2013'+ausData.ga+' on goals after '+ausPlayed+' game'+(ausPlayed!==1?'s':'')+'. '+ausOwner+' will take it.',
        'The Aussies have conceded but they\u2019re still on the board. '+ausOwner+' is staying positive.',
        'Australia scoring freely, leaking a few. '+ausOwner+' is keeping the faith.',
      ]));
    }
  }

  // 3. Today/tomorrow office clashes with contextual sledge (max 2)
  FIXTURES.filter(fix=>{
    const ho=countryToOwner[fix.home],ao=countryToOwner[fix.away];
    return ho&&ao&&ho!==ao&&(fix.d===todayIso||fix.d===tomorrowIso);
  }).slice(0,2).forEach(fix=>{
    const ho=countryToOwner[fix.home],ao=countryToOwner[fix.away];
    const sledge=generateContextualSledge(fix.home,fix.away);
    const label=fix.d===todayIso?'TODAY':'TOMORROW';
    lines.push('OFFICE CLASH '+label+' \u2014 '+ho+' ('+fix.home+') vs '+ao+' ('+fix.away+'): '+sledge);
  });

  // 4. Top goals participant callout
  const topGf=[...lb].sort((a,b)=>b.gf-a.gf)[0];
  if(topGf&&topGf.gf>0){
    lines.push(_pick([
      topGf.name+'\u2019s teams lead the goals chart with '+topGf.gf+' \u2014 showing up when it counts.',
      'Most goals in this sweepstake: '+topGf.name+' with '+topGf.gf+'. That\u2019s the kind of stat you put in the group chat.',
      topGf.name+' is pumping in goals. '+topGf.gf+' for the tournament. Dangerous.',
    ]));
  }

  // 5. Most goals conceded roast
  const gaMap=lb.map(p=>({name:p.name,ga:p.teams.reduce((s,t)=>s+(RESULTS_DATA[t]?.ga||0),0)}));
  const mostGA=gaMap.sort((a,b)=>b.ga-a.ga)[0];
  if(mostGA&&mostGA.ga>0){
    lines.push(_pick([
      mostGA.name+'\u2019s teams have shipped '+mostGA.ga+' goals between them. A sieve at the back.',
      'Defensive crisis: '+mostGA.name+' has conceded '+mostGA.ga+'. They are not keeping clean sheets. They are not trying to.',
      'Leakiest defence award goes to '+mostGA.name+' with '+mostGA.ga+' conceded. Goals for everyone, just not for the right team.',
    ]));
  }

  // 6. Neck-and-neck FIFA pts battle
  const byFifa=lb.map(p=>({...p,fifa:p.teams.reduce((s,t)=>s+getTeamFifaPts(t),0)})).sort((a,b)=>b.fifa-a.fifa);
  for(let i=0;i<byFifa.length-1;i++){
    if(byFifa[i].fifa===byFifa[i+1].fifa&&byFifa[i].fifa>0){
      lines.push(byFifa[i].name+' and '+byFifa[i+1].name+' are dead level on '+byFifa[i].fifa+' FIFA pts. Something has to give.');
      break;
    }
  }

  // 7. Zero scorer roast — participant whose teams have zero goals
  const scoreless=lb.filter(p=>p.gf===0&&p.teams.some(t=>{const d=RESULTS_DATA[t];return d&&(d.gf>0||d.ga>0);}));
  if(scoreless.length){
    const s=scoreless[Math.floor(Math.random()*scoreless.length)];
    lines.push(_pick([
      s.name+'\u2019s teams have scored zero goals so far. Absolute drought. The ball has avoided them personally.',
      'Not a single goal from '+s.name+'\u2019s teams yet. Frustrating viewing. Brave face.',
      s.name+': still waiting for the first goal. The optimism is admirable at this point.',
    ]));
  }

  // 8-10. Pad from CI-generated BANTER_FEED (scorers, stage banter, etc.)
  const banterPool=[...BANTER_FEED];
  while(lines.length<10&&banterPool.length){
    const i=Math.floor(Math.random()*banterPool.length);
    lines.push(banterPool.splice(i,1)[0]);
  }

  return lines.filter(Boolean).slice(0,10);
}

function initWorkplaceMatchups(){
  if(typeof PARTICIPANTS==='undefined'||typeof FIXTURES==='undefined'||typeof RESULTS_DATA==='undefined'){
    console.error('Office Duels: required globals missing');return;
  }
  const countryToOwner={};
  PARTICIPANTS.forEach(u=>{u.teams.forEach(t=>{countryToOwner[t]=u.name;});});

  const todayMidnight=new Date();todayMidnight.setHours(0,0,0,0);
  const _todayIso=new Date().toISOString().slice(0,10);
  const _tomorrowIso=new Date(Date.now()+86400000).toISOString().slice(0,10);

  const duels=FIXTURES.reduce((acc,fix)=>{
    const homeOwner=countryToOwner[fix.home];
    const awayOwner=countryToOwner[fix.away];
    if(!homeOwner||!awayOwner||homeOwner===awayOwner)return acc;
    if(fix.d!==_todayIso&&fix.d!==_tomorrowIso)return acc;

    const homeStage=(RESULTS_DATA[fix.home]&&RESULTS_DATA[fix.home].stage)||'Group stage';
    const awayStage=(RESULTS_DATA[fix.away]&&RESULTS_DATA[fix.away].stage)||'Group stage';

    const matchDate=new Date(fix.d);
    let derivedStatus;
    if(matchDate<todayMidnight)derivedStatus='finished';
    else if(matchDate.toDateString()===todayMidnight.toDateString())derivedStatus='today';
    else derivedStatus='upcoming';

    acc.push({home:fix.home,away:fix.away,d:fix.d,t:fix.t,group:fix.group,
      homeOwner,awayOwner,homeStage,awayStage,derivedStatus,
      hg:fix.hg,ag:fix.ag});
    return acc;
  },[]);

  renderWorkplaceMatchupCards(duels);
}

function renderWorkplaceMatchupCards(duels){
  const grid=document.getElementById('h2h-match-grid');
  if(!grid)return;
  if(!duels.length){
    grid.innerHTML='<p class="h2h-empty">No direct colleague matchups found.</p>';return;
  }
  grid.innerHTML=duels.map(m=>{
    const hasScore=m.hg!==undefined&&m.ag!==undefined;
    const homeWon=hasScore&&m.hg>m.ag;
    const awayWon=hasScore&&m.ag>m.hg;
    const isHot=!hasScore;
    const badge='';
const statusLabel=hasScore?'Result '+m.hg+' \u2013 '+m.ag:(m.derivedStatus==='today'?'TODAY':m.derivedStatus.toUpperCase());
    const statusClass=hasScore?'finished':m.derivedStatus;
    const homeWinBadge=homeWon?' <span style="color:#ffd700;font-size:11px;font-weight:700">🏆 WIN</span>':'';
    const awayWinBadge=awayWon?' <span style="color:#ffd700;font-size:11px;font-weight:700">🏆 WIN</span>':'';
    return `<div class="h2h-card${isHot?' workplace-duel':''}">
      ${badge}
      <div class="h2h-meta">
        <span>Group ${m.group} &middot; ${m.d} ${m.t} HKT</span>
        <span class="status-indicator ${statusClass}">${statusLabel}</span>
      </div>
      <div class="h2h-teams-block">
        <div class="h2h-competitor">
          <div class="coworker-identity">${m.homeOwner}${homeWinBadge}</div>
          <div class="nation-identity">🏠 ${m.home}</div>
        </div>
        <div class="h2h-divider">VS</div>
        <div class="h2h-competitor">
          <div class="coworker-identity">${m.awayOwner}${awayWinBadge}</div>
          <div class="nation-identity">✈️ ${m.away}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* live-poll: fetch wc_data.json every 10 min and hot-update globals */
(function(){
  var _lastSeen='';
  function pollData(){
    fetch('wc_data.json?_='+Date.now())
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        if(!d||d.last_updated===_lastSeen)return;
        _lastSeen=d.last_updated;
        Object.keys(RESULTS_DATA).forEach(function(k){delete RESULTS_DATA[k];});
        Object.assign(RESULTS_DATA,d.results);
        FIXTURES.forEach(function(fix){
          var key=fix.home+'|'+fix.away;
          if(d.match_scores&&d.match_scores[key]){fix.hg=d.match_scores[key][0];fix.ag=d.match_scores[key][1];}

        BANTER_FEED.splice(0,BANTER_FEED.length);
        if(d.banter_feed)d.banter_feed.forEach(function(b){BANTER_FEED.push(b);});
        if(d.scorers){SCORERS_DATA.splice(0,SCORERS_DATA.length);d.scorers.forEach(function(s){SCORERS_DATA.push(s);});}
        var knockoutsStarted=
          Object.values(RESULTS_DATA).some(function(r){return r.stage!=='Group stage exit';})||
          getKoPlayedFixtures().length>0;
        var lb=buildLeaderboard();
        var koEl=document.getElementById('ko-leaderboard');
        if(koEl)koEl.innerHTML=renderLeagueTable(lb,knockoutsStarted);
        document.getElementById('cgrid').innerHTML=renderGroupStageFinalScoreboard();
        var gbEl=document.getElementById('gb-sec');
        if(gbEl)gbEl.innerHTML=renderTopScorers(SCORERS_DATA);
        initCounters();
        initReveal();
        initBanterTicker(buildLiveBanter(lb));
      })
      .catch(function(){});
  }
  setInterval(pollData,600000);
  pollData();
})();
